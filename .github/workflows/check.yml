# step242 CI: parse gate + NIST corpus gate on every push/PR.

name: step242 checks

on:
  push:
    branches: ['*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # pytest + rdflib: the Turtle round-trip checks in
          # tests/structure_test.py need rdflib and skip without it.
          pip install pytest rdflib
          pip install -e .
      - name: Run tests
        run: pytest tests/ -q --tb=short