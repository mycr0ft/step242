# GitLab CI: STEP parse + check + WHERE + baseline gate via step242.
#
# Include from your .gitlab-ci.yml:
#
#   include:
#     - remote: 'https://raw.githubusercontent.com/mycr0ft/step242/main/gitlab/step-check.gitlab-ci.yml'
#
#   step-check:
#     extends: .step-check
#     variables:
#       STEP_PATHS: "step/"
#       STEP242_SEMANTIC: "advisory"    # off | advisory | strict
#       # STEP242_BASELINE: "config-mgmt/baseline.json"
#
# Parse failures are ALWAYS blocking; schema-level semantics are
# advisory by default (STEP242_SEMANTIC=strict to block, off to skip).
#
# NOTE: the project was called `stepper` until 2026-10-21 and is now
# `step242` (PyPI's `stepper` name belongs to an unrelated motor-control
# package). We install from GitHub main until the first PyPI release;
# after that, pin `step242==X.Y.Z`.
#
# STEP242_SEMANTIC / STEP242_BASELINE are the current variable names;
# the pre-rename STEPPER_SEMANTIC / STEPPER_BASELINE still work.

.step-check:
  image: python:3.13
  variables:
    STEP_PATHS: "."
    STEP242_SEMANTIC: "advisory"
    STEP242_BASELINE: ""   # optional: path to a pinned baseline manifest
    GIT_STRATEGY: clone
  before_script:
    - pip install git+https://github.com/mycr0ft/step242@main
  script:
    - |
      rc=0
      # shellcheck disable=SC2086
      files=$(find $STEP_PATHS \( -name '*.stp' -o -name '*.step' -o -name '*.p21' \) -type f 2>/dev/null)
      for f in $files; do
        echo "== $f"
        step242 check "$f" --semantic "${STEP242_SEMANTIC:-${STEPPER_SEMANTIC:-advisory}}" || rc=1
      done
      baseline="${STEP242_BASELINE:-${STEPPER_BASELINE:-}}"
      if [ -n "$baseline" ]; then
        # shellcheck disable=SC2086
        step242 baseline gate "$baseline" --step $files || rc=1
      fi
      exit $rc
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - if: '$CI_COMMIT_BRANCH'
      changes: ["**/*.stp", "**/*.step", "**/*.p21"]
      when: always
    - when: manual
      allow_failure: true